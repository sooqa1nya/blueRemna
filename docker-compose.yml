services:
  db:
    image: postgres:18
    container_name: vpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: "Europe/Moscow"
      PGTZ: "Europe/Moscow"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - vpnNetwork
  vpn:
    image: sooqa1nya/remna:latest
    container_name: vpn-bot
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - vpnNetwork
      - remnawave-network
    ports:
      - "127.0.0.1:6663:6663"
    depends_on:
      - db

networks:
  vpnNetwork:
  remnawave-network:
    external: true

volumes:
  postgres_data:
